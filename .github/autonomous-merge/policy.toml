# Autonomous Merge Shadow Modeの初期policy。
#
# healthは事故確率ではなく、CI・テスト・セキュリティ・復旧能力を後から観測値へ
# 置き換えるためのcontrol maturity index。Shadow Modeではまず90を仮置きし、
# 30〜90日分の実績を見て更新する。
version = 1
mode = "shadow"

[project]
health = 90
minimum_health = 80

[scoring]
# 25以下かつHard GateなしのPRだけを「自動merge候補」として記録する。
# 現在はShadow Modeのため、下記の判定がマージ可否へ接続されることはない。
maximum_pr_risk = 25
maximum_path_risk = 35

# 変更行数が大きいほど、レビュー・テストの組み合わせが増えることを表す。
line_bands = [
  { maximum = 0, risk = 0 },
  { maximum = 20, risk = 5 },
  { maximum = 80, risk = 10 },
  { maximum = 200, risk = 20 },
  { maximum = 400, risk = 30 },
  { maximum = 1000000, risk = 40 },
]

# 変更ファイル数は依存関係の広がりの粗い代理指標として使う。
file_bands = [
  { maximum = 0, risk = 0 },
  { maximum = 2, risk = 5 },
  { maximum = 5, risk = 10 },
  { maximum = 10, risk = 20 },
  { maximum = 1000000, risk = 30 },
]

[verification]
# このリポジトリの実コードとテストの配置に合わせたglob。
code_globs = [
  "index.html",
  "src/**/*.ts",
  "src/**/*.tsx",
  "src/**/*.css",
  "scripts/**/*.mjs",
  "*.config.*",
  "*.json",
  "public/**",
  ".github/**/*.py",
  ".github/**/*.yml",
  ".github/**/*.yaml",
]
test_globs = [
  "tests/unit/**/*.test.ts",
  "tests/unit/**/*.spec.ts",
  "tests/playtest/**/*.test.ts",
  "tests/e2e/**/*.test.ts",
  "tests/e2e/**/*.spec.ts",
  "tests/**/*-snapshots/**/*.png",
  "tests/**/__snapshots__/**/*.snap",
  "src/**/*.test.ts",
  "src/**/*.spec.ts",
  ".github/autonomous-merge/test_*.py",
]
ignored_globs = []
missing_test_risk = 15
test_removal_risk = 20

[[verification.scopes]]
name = "visual"
fallback = false
excluded_code_globs = ["public/assets/audio/**"]
code_globs = [
  "index.html",
  "src/**/*.css",
  "src/utils/publicUrl.ts",
  "src/ui/**",
  "src/render/**",
  "src/App.tsx",
  "src/main.tsx",
  "public/**",
]
test_globs = [
  "tests/e2e/**/*.test.ts",
  "tests/e2e/**/*.spec.ts",
  "tests/**/*-snapshots/**/*.png",
]
binary_test_globs = [
  "tests/**/*-snapshots/**/*.png",
]

[[verification.scopes]]
name = "simulation"
fallback = false
code_globs = ["src/sim/**"]
test_globs = [
  "tests/unit/sim/**/*.test.ts",
  "tests/unit/sim/**/*.spec.ts",
  "tests/playtest/**/*.test.ts",
  "tests/**/__snapshots__/**/*.snap",
]

[[verification.scopes]]
name = "data"
fallback = false
code_globs = ["src/data/**"]
test_globs = [
  "tests/unit/data/**/*.test.ts",
  "tests/unit/data/**/*.spec.ts",
  "tests/unit/sim/**/*.test.ts",
  "tests/unit/sim/**/*.spec.ts",
  "tests/playtest/**/*.test.ts",
  "tests/**/__snapshots__/**/*.snap",
]

[[verification.scopes]]
name = "state"
fallback = false
code_globs = ["src/state/**"]
test_globs = [
  "tests/unit/state/**/*.test.ts",
  "tests/unit/state/**/*.spec.ts",
  "tests/e2e/**/*persistence*.test.ts",
  "tests/e2e/**/*persistence*.spec.ts",
]

[[verification.scopes]]
name = "audio"
fallback = false
code_globs = ["src/audio/**", "src/utils/publicUrl.ts", "public/assets/audio/**"]
test_globs = [
  "tests/unit/audio/**/*.test.ts",
  "tests/unit/audio/**/*.spec.ts",
]

[[verification.scopes]]
name = "scripts"
fallback = false
code_globs = ["scripts/**"]
test_globs = ["tests/unit/scripts/**/*.test.ts", "tests/unit/scripts/**/*.spec.ts"]

[[verification.scopes]]
name = "automation"
fallback = false
code_globs = [".github/**/*.py", ".github/**/*.yml", ".github/**/*.yaml"]
test_globs = [".github/autonomous-merge/test_*.py"]

[[verification.scopes]]
name = "configuration"
fallback = false
code_globs = ["*.config.*", "*.json"]
test_globs = [
  "tests/**/*.test.ts",
  "tests/**/*.spec.ts",
]

[[verification.scopes]]
name = "src-fallback"
fallback = true
code_globs = ["src/**"]
test_globs = [
  "tests/unit/**/*.test.ts",
  "tests/unit/**/*.spec.ts",
  "tests/playtest/**/*.test.ts",
  "tests/**/__snapshots__/**/*.snap",
  "src/**/*.test.ts",
  "src/**/*.spec.ts",
]

