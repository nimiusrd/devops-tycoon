<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Rework確率とIncident確率の代表曲線</title>
  <desc id="desc">
    左はAI依存度が上がるとRework確率が上がる様子、右はテストカバレッジが上がるとIncident確率が下がる様子を、AI利用ありとなしで比較する。
  </desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; }
    .grid { stroke: #cbd5e1; stroke-width: 1; }
    .axis { stroke: #64748b; stroke-width: 1.5; }
    .text { fill: #334155; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #64748b; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .ai { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    .no-ai { fill: none; stroke: #dc2626; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    .ai-dot { fill: #2563eb; }
    .no-ai-dot { fill: #dc2626; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .panel { fill: #111827; stroke: #475569; }
      .grid { stroke: #334155; }
      .axis { stroke: #94a3b8; }
      .text { fill: #e2e8f0; }
      .muted { fill: #94a3b8; }
      .ai { stroke: #60a5fa; }
      .no-ai { stroke: #f87171; }
      .ai-dot { fill: #60a5fa; }
      .no-ai-dot { fill: #f87171; }
    }
  </style>

  <rect class="bg" width="1000" height="520" rx="16" />

  <g aria-label="凡例">
    <line class="ai" x1="345" y1="32" x2="385" y2="32" />
    <circle class="ai-dot" cx="365" cy="32" r="5" />
    <text class="text" x="395" y="38" font-size="16">AI利用あり</text>
    <line class="no-ai" x1="520" y1="32" x2="560" y2="32" />
    <circle class="no-ai-dot" cx="540" cy="32" r="5" />
    <text class="text" x="570" y="38" font-size="16">AI利用なし</text>
  </g>

  <g aria-label="AI依存度とRework確率">
    <rect class="panel" x="30" y="60" width="455" height="405" rx="12" />
    <text class="text" x="257.5" y="91" font-size="20" font-weight="600" text-anchor="middle">AI依存度とRework確率</text>
    <text class="muted" x="257.5" y="116" font-size="13" text-anchor="middle">AI Literacy 45 / Quality 60 / 初回Review / 補正なし</text>

    <line class="grid" x1="90" y1="150" x2="455" y2="150" />
    <line class="grid" x1="90" y1="215.7" x2="455" y2="215.7" />
    <line class="grid" x1="90" y1="281.4" x2="455" y2="281.4" />
    <line class="grid" x1="90" y1="347.1" x2="455" y2="347.1" />
    <line class="grid" x1="90" y1="380" x2="455" y2="380" />
    <line class="axis" x1="90" y1="150" x2="90" y2="380" />
    <line class="axis" x1="90" y1="380" x2="455" y2="380" />

    <text class="muted" x="78" y="385" font-size="12" text-anchor="end">0%</text>
    <text class="muted" x="78" y="352" font-size="12" text-anchor="end">5%</text>
    <text class="muted" x="78" y="286" font-size="12" text-anchor="end">15%</text>
    <text class="muted" x="78" y="220" font-size="12" text-anchor="end">25%</text>
    <text class="muted" x="78" y="155" font-size="12" text-anchor="end">35%</text>

    <text class="muted" x="90" y="402" font-size="12" text-anchor="middle">0</text>
    <text class="muted" x="181.25" y="402" font-size="12" text-anchor="middle">25</text>
    <text class="muted" x="272.5" y="402" font-size="12" text-anchor="middle">50</text>
    <text class="muted" x="363.75" y="402" font-size="12" text-anchor="middle">75</text>
    <text class="muted" x="455" y="402" font-size="12" text-anchor="middle">100</text>
    <text class="text" x="272.5" y="430" font-size="14" text-anchor="middle">AI依存度</text>

    <polyline class="ai" points="90,366.9 181.25,337.3 272.5,284.7 363.75,232.1 455,179.6" />
    <polyline class="no-ai" points="90,366.9 181.25,366.9 272.5,350.4 363.75,297.9 455,245.3" />

    <g class="ai-dot">
      <circle cx="90" cy="366.9" r="5" />
      <circle cx="181.25" cy="337.3" r="5" />
      <circle cx="272.5" cy="284.7" r="5" />
      <circle cx="363.75" cy="232.1" r="5" />
      <circle cx="455" cy="179.6" r="5" />
    </g>
    <g class="no-ai-dot">
      <circle cx="90" cy="366.9" r="5" />
      <circle cx="181.25" cy="366.9" r="5" />
      <circle cx="272.5" cy="350.4" r="5" />
      <circle cx="363.75" cy="297.9" r="5" />
      <circle cx="455" cy="245.3" r="5" />
    </g>
  </g>

  <g aria-label="テストカバレッジとIncident確率">
    <rect class="panel" x="515" y="60" width="455" height="405" rx="12" />
    <text class="text" x="742.5" y="91" font-size="20" font-weight="600" text-anchor="middle">Test CoverageとIncident確率</text>
    <text class="muted" x="742.5" y="116" font-size="13" text-anchor="middle">AI Literacy 45 / Incident倍率 1.0</text>

    <line class="grid" x1="575" y1="150" x2="940" y2="150" />
    <line class="grid" x1="575" y1="207.5" x2="940" y2="207.5" />
    <line class="grid" x1="575" y1="265" x2="940" y2="265" />
    <line class="grid" x1="575" y1="322.5" x2="940" y2="322.5" />
    <line class="grid" x1="575" y1="380" x2="940" y2="380" />
    <line class="axis" x1="575" y1="150" x2="575" y2="380" />
    <line class="axis" x1="575" y1="380" x2="940" y2="380" />

    <text class="muted" x="563" y="385" font-size="12" text-anchor="end">0%</text>
    <text class="muted" x="563" y="328" font-size="12" text-anchor="end">4%</text>
    <text class="muted" x="563" y="270" font-size="12" text-anchor="end">8%</text>
    <text class="muted" x="563" y="213" font-size="12" text-anchor="end">12%</text>
    <text class="muted" x="563" y="155" font-size="12" text-anchor="end">16%</text>

    <text class="muted" x="575" y="402" font-size="12" text-anchor="middle">0</text>
    <text class="muted" x="666.25" y="402" font-size="12" text-anchor="middle">25</text>
    <text class="muted" x="757.5" y="402" font-size="12" text-anchor="middle">50</text>
    <text class="muted" x="848.75" y="402" font-size="12" text-anchor="middle">75</text>
    <text class="muted" x="940" y="402" font-size="12" text-anchor="middle">100</text>
    <text class="text" x="757.5" y="430" font-size="14" text-anchor="middle">Test Coverage</text>

    <polyline class="ai" points="575,168 666.25,204 757.5,240 848.75,276 940,312" />
    <polyline class="no-ai" points="575,207.5 666.25,243.4 757.5,279.4 848.75,315.3 940,351.3" />

    <g class="ai-dot">
      <circle cx="575" cy="168" r="5" />
      <circle cx="666.25" cy="204" r="5" />
      <circle cx="757.5" cy="240" r="5" />
      <circle cx="848.75" cy="276" r="5" />
      <circle cx="940" cy="312" r="5" />
    </g>
    <g class="no-ai-dot">
      <circle cx="575" cy="207.5" r="5" />
      <circle cx="666.25" cy="243.4" r="5" />
      <circle cx="757.5" cy="279.4" r="5" />
      <circle cx="848.75" cy="315.3" r="5" />
      <circle cx="940" cy="351.3" r="5" />
    </g>
  </g>

  <text class="muted" x="500" y="500" font-size="13" text-anchor="middle">線はモデル式から算出した条件付き確率。Monte Carloの観測値ではない。</text>
</svg>
