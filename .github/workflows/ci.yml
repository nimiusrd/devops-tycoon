name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci_scope:
    name: Determine whether CI is needed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_checks: ${{ steps.scope.outputs.run_checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: nimiusrd/should-run-checks@33052b9a5bd942f15d8aa62dbbdef2463e44412b # v0.1.1
        id: scope
        with:
          config-path: .github/ci-skip-rules.json

  test:
    name: Lint & Unit (Vitest)
    needs: ci_scope
    if: ${{ always() && needs.ci_scope.outputs.run_checks != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run balance:check
      - run: npm run test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: E2E (Playwright)
    needs: ci_scope
    if: ${{ always() && needs.ci_scope.outputs.run_checks != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # 視覚回帰のフォントとOSをDev Containerのベースライン撮影環境に揃える。
      image: mcr.microsoft.com/devcontainers/typescript-node:24-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1
      - name: Verify production chunk recovery
        run: |
          npm run build
          npm run test:e2e -- tests/e2e/webgl-availability.spec.ts --grep 'チャンク取得' --workers=1
        env:
          PLAYWRIGHT_PREVIEW: '1'
          PLAYWRIGHT_PORT: '5175'
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/production
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
