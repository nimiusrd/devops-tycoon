name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci_scope:
    name: Determine whether CI is needed
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    outputs:
      run_checks: ${{ steps.scope.outputs.run_checks }}
      superseded: ${{ steps.supersede.outputs.superseded }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # より小さい run ID だけを止める。より大きい実行中の run がある再実行は自分を止める。
      # 取り消し API が使えないフォークでは、E2E の concurrency が同時実行を防ぐ。
      - name: Cancel superseded pull request runs
        id: supersede
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          RUN_ID: ${{ github.run_id }}
        run: node scripts/cancel-superseded-pr-runs.mjs
      - uses: nimiusrd/should-run-checks@d7138ff8549a9410601e972c41f0f1257514f390 # v1.0.0
        id: scope
        if: steps.supersede.outputs.superseded != 'true'
        with:
          skip-extensions: |
            .md
          skip-directories: |
            mockups

  test:
    name: Lint & Unit (Vitest)
    needs: ci_scope
    if: ${{ always() && !cancelled() && needs.ci_scope.outputs.superseded != 'true' && needs.ci_scope.outputs.run_checks != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run balance:check
      - run: npm run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: E2E (Playwright)
    needs: ci_scope
    # pull_request では、この run が最新コミットだと判定できたときだけ E2E を始める。
    # always() だけだと workflow の取り消し後もジョブが続くため、cancelled では止める。
    if: ${{ always() && !cancelled() && needs.ci_scope.outputs.superseded != 'true' && needs.ci_scope.outputs.run_checks != 'false' && (github.event_name != 'pull_request' || needs.ci_scope.outputs.superseded == 'false') }}
    # フォークの GITHUB_TOKEN は run を取り消せない。待ち行列で同時実行だけを防ぎ、
    # 古い run が後から入っても実行中の E2E は取り消さない。
    concurrency:
      group: ci-e2e-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    # ブラウザ準備・2並列の全E2E・本番チャンク復旧検証まで含めた実行枠。
    timeout-minutes: 25
    container:
      # 視覚回帰のフォントとOSをDev Containerのベースライン撮影環境に揃える。
      image: mcr.microsoft.com/devcontainers/typescript-node:24-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
      - name: Verify production chunk recovery
        run: |
          npm run build
          npm run test:e2e -- tests/e2e/webgl-availability.spec.ts --grep 'チャンク取得' --workers=1
        env:
          PLAYWRIGHT_PREVIEW: '1'
          PLAYWRIGHT_PORT: '5175'
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/production
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
