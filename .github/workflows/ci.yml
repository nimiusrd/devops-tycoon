name: CI

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - 'docs/generated/balance-parameters.md'
      - 'docs/generated/content-catalog.md'
      - 'docs/generated/balance-curves.svg'
      - 'docs/probability-model.md'
      - '!mockups/**'
  pull_request:

jobs:
  ci_scope:
    name: Determine whether CI is needed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_checks: ${{ steps.scope.outputs.run_checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Check changed paths
        id: scope
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          changed_files="$RUNNER_TEMP/changed-files"
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            git diff --name-only -z "${PR_BASE_SHA}...${HEAD_SHA}" > "$changed_files"
          elif [[ "$PUSH_BASE_SHA" =~ ^0+$ ]]; then
            echo 'run_checks=true' >> "$GITHUB_OUTPUT"
            exit 0
          else
            git diff --name-only -z "${PUSH_BASE_SHA}..${HEAD_SHA}" > "$changed_files"
          fi

          run_checks=false
          while IFS= read -r -d '' path; do
            case "$path" in
              mockups/*) continue ;;
              docs/generated/balance-parameters.md|docs/generated/content-catalog.md|docs/probability-model.md)
                run_checks=true
                break
                ;;
              *.md) continue ;;
              *)
                run_checks=true
                break
                ;;
            esac
          done < "$changed_files"
          echo "run_checks=$run_checks" >> "$GITHUB_OUTPUT"

  test:
    name: Lint & Unit (Vitest)
    needs: ci_scope
    if: ${{ always() && needs.ci_scope.outputs.run_checks != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run balance:check
      - run: npm run test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: E2E (Playwright)
    needs: ci_scope
    if: ${{ always() && needs.ci_scope.outputs.run_checks != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # 視覚回帰のフォントとOSをDev Containerのベースライン撮影環境に揃える。
      image: mcr.microsoft.com/devcontainers/typescript-node:24-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1
      - name: Verify production chunk recovery
        run: |
          npm run build
          npm run test:e2e -- tests/e2e/webgl-availability.spec.ts --grep 'チャンク取得' --workers=1
        env:
          PLAYWRIGHT_PREVIEW: '1'
          PLAYWRIGHT_PORT: '5175'
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/production
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
