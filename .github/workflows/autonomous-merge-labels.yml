name: Autonomous Merge Labels

# ラベルは1日1回・手動の全体更新。イベント駆動の観測はShadow workflowに残す。
on:
  schedule:
    - cron: '43 0 * * *' # 日本時間09:43
  workflow_dispatch:

permissions:
  contents: read

# 観測開始から公開完了まで単一writer。待機runが置き換わっても次は全PRを再取得する。
concurrency:
  group: autonomous-merge-labels
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/autonomous-merge
      - name: Observe all open PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B .github/autonomous-merge/collect.py \
            --policy .github/autonomous-merge/policy.toml \
            --evaluator-sha "$(git rev-parse HEAD)" \
            --output shadow-report
      - name: Write observation summary
        if: ${{ always() }}
        run: |
          if [[ -f shadow-report/summary.md ]]; then
            cat shadow-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save this attempt's observations
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shadow-labels-${{ github.run_id }}-${{ github.run_attempt }}
          path: shadow-report/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: observe
    if: ${{ !cancelled() && (needs.observe.result == 'success' || needs.observe.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/autonomous-merge
      # 過去attemptへフォールバックしない。失敗時は全job再実行か新しい手動実行を使う。
      - name: Download this attempt's observations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shadow-labels-${{ github.run_id }}-${{ github.run_attempt }}
          path: shadow-report
      - name: Publish labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/autonomous-merge/publish.py --report-dir shadow-report
