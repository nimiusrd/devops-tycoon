name: Autonomous Merge Shadow
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number && format('shadow-pr-{0}', inputs.pr_number) || github.event_name == 'workflow_dispatch' && 'shadow-all' || github.event.pull_request.number && format('shadow-pr-{0}', github.event.pull_request.number) || format('shadow-{0}', github.event_name) }}

# 観測はread-only。ラベル更新はpublish jobだけが行う。
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  push:
  workflow_run:
    # 移植時に観測対象のCI workflow名へ変更する。自身の完了は購読しない。
    workflows: ['CI', 'Autonomous Merge Tests']
    types: [completed]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number (empty = all open PRs)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  observe:
    # 自己の完了イベントによる再帰実行と、通常ブランチpushとの二重観測を避ける。
    if: >-
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.name != 'Autonomous Merge Shadow') &&
      (github.event_name != 'push' ||
       github.ref_name == github.event.repository.default_branch)
    # 古い観測だけ打ち切る。workflow全体をキャンセルすると実行中のpublishも落ちる。
    concurrency:
      group: autonomous-merge-shadow-observe-${{ github.event.pull_request.number || inputs.pr_number || github.event_name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/autonomous-merge
      - name: Observe GitHub facts
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ ! -f .github/autonomous-merge/collect.py ]]; then
            mkdir -p shadow-report
            echo 'INSUFFICIENT_DATA: metadata collector is not on the default branch yet.' > shadow-report/summary.md
            exit 0
          fi
          args=()
          if [[ -n "${REQUESTED_PR}" ]]; then
            if [[ ! "${REQUESTED_PR}" =~ ^[1-9][0-9]*$ ]]; then
              echo 'Invalid PR number' >&2
              exit 1
            fi
            args+=(--pr "${REQUESTED_PR}")
          fi
          python3 -B .github/autonomous-merge/collect.py \
            --policy .github/autonomous-merge/policy.toml \
            --evaluator-sha "$(git rev-parse HEAD)" \
            --output shadow-report "${args[@]}"
      - name: Write observation summary
        if: ${{ always() }}
        run: |
          if [[ -f shadow-report/summary.md ]]; then
            cat shadow-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'INSUFFICIENT_DATA: collection did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo ""
            echo "観測run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save timestamped observations
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shadow-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: shadow-report/
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: observe
    if: >-
      ${{ !cancelled() &&
          (needs.observe.result == 'success' || needs.observe.result == 'failure') &&
          (github.event_name != 'pull_request_review' ||
           github.event.pull_request.head.repo.full_name == github.repository) }}
    # 同一PR（または同一イベント名）だけ直列化する。
    # 全イベントを1 groupにすると、待機は1件しか残らず他PRのpendingが落ちる。
    concurrency:
      group: autonomous-merge-shadow-publish-${{ github.event.pull_request.number || inputs.pr_number || github.event_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/autonomous-merge
      - name: Download observations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: shadow-observations-${{ github.run_id }}-*
          path: shadow-artifacts
      - name: Select latest observation artifact
        id: select
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(shadow-artifacts/shadow-observations-${GITHUB_RUN_ID}-*)
          if [[ ${#artifacts[@]} -eq 0 ]]; then
            echo 'no observation artifact for this run' >&2
            exit 1
          fi
          latest_attempt=0
          latest_dir=""
          for dir in "${artifacts[@]}"; do
            attempt="${dir##*-}"
            if [[ "${attempt}" =~ ^[1-9][0-9]*$ ]] && (( attempt >= latest_attempt )); then
              latest_attempt="${attempt}"
              latest_dir="${dir}"
            fi
          done
          if [[ -z "${latest_dir}" ]]; then
            echo 'no numbered observation artifact for this run' >&2
            exit 1
          fi
          mkdir -p shadow-report
          cp -a "${latest_dir}/." shadow-report/
          echo "using ${latest_dir}"
          echo "attempt=${latest_attempt}" >> "$GITHUB_OUTPUT"
      - name: Publish observation labels
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ ! -f .github/autonomous-merge/publish.py ]]; then
            echo 'publisher is not on the default branch yet.'
            exit 0
          fi
          python3 -B .github/autonomous-merge/publish.py \
            --report-dir shadow-report \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${{ steps.select.outputs.attempt }}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --default-branch "${DEFAULT_BRANCH}"
