# この公開リポジトリの運用設定です。action_ref は利用する release の実 SHA に固定します。
# 汎用例: https://github.com/nimiusrd/pr-merge-readiness-action/blob/main/examples/multiple-workflows.toml
version = 1
action_ref = "b3a6259c4b6dae30ebf5fd60c0aeac5ead0819f7"

[ci]
workflows = ["CI"]

[review]
minimum_approvals = 0
require_resolved_threads = true
stale_change_review_days = 30

[publication]
checks = true
labels = "manual"

[[ci.required_checks]]
kind = "check_run"
name = "Lint & Unit (Vitest)"
app_id = 15368

[[ci.required_checks]]
kind = "check_run"
name = "E2E (Playwright)"
app_id = 15368
