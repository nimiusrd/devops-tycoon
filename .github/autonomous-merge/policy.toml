# Autonomous Merge Shadow Modeの初期policy。
#
# healthは事故確率ではなく、CI・テスト・セキュリティ・復旧能力を後から観測値へ
# 置き換えるためのcontrol maturity index。Shadow Modeではまず90を仮置きし、
# 30〜90日分の実績を見て更新する。
version = 1
mode = "shadow"

[project]
health = 90
minimum_health = 80

[scoring]
# 25以下かつHard GateなしのPRだけを「自動merge候補」として記録する。
# 現在はShadow Modeのため、下記の判定がマージ可否へ接続されることはない。
maximum_pr_risk = 25
maximum_path_risk = 35

# 変更行数が大きいほど、レビュー・テストの組み合わせが増えることを表す。
line_bands = [
  { maximum = 0, risk = 0 },
  { maximum = 20, risk = 5 },
  { maximum = 80, risk = 10 },
  { maximum = 200, risk = 20 },
  { maximum = 400, risk = 30 },
  { maximum = 1000000, risk = 40 },
]

# 変更ファイル数は依存関係の広がりの粗い代理指標として使う。
file_bands = [
  { maximum = 0, risk = 0 },
  { maximum = 2, risk = 5 },
  { maximum = 5, risk = 10 },
  { maximum = 10, risk = 20 },
  { maximum = 1000000, risk = 30 },
]

[verification]
# このリポジトリの実コードとテストの配置に合わせたglob。
code_globs = [
  "index.html",
  "src/**/*.ts",
  "src/**/*.tsx",
  "src/**/*.css",
  "scripts/**/*.mjs",
  "*.config.*",
  "*.json",
  "public/assets/**",
  ".github/**/*.py",
  ".github/**/*.yml",
  ".github/**/*.yaml",
]
test_globs = [
  "tests/**/*.ts",
  "tests/**/*-snapshots/**",
  "tests/**/__snapshots__/**",
  "src/**/*.test.ts",
  "src/**/*.spec.ts",
  ".github/**/test_*.py",
]
ignored_globs = []
missing_test_risk = 15

# ルールはファイルごとの最大値を採用し、全ファイルの合計を
# scoring.maximum_path_riskでcapする。hard_gate=trueはリスク値に関係なく
# HUMAN_REVIEW_REQUIREDとする。
[[path_rules]]
pattern = ".github/autonomous-merge/**"
risk = 100
hard_gate = true
reason = "評価器・policyの変更"

[[path_rules]]
pattern = ".github/workflows/**"
risk = 100
hard_gate = true
reason = "GitHub Actions workflowの変更"

