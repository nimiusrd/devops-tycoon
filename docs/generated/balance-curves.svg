  <title id="title">現行モデルのRework確率とIncident確率の代表曲線</title>
  <desc id="desc">
    左は組織の累積AI依存度が上がるとRework確率が上がる様子、右はテストカバレッジが上がるとIncident確率が下がる様子を、対象タスクのAI支援ありとなしで比較する。
  </desc>
