<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DevOps Tycoon — ドリルダウン遷移演出（全社→チーム現場）</title>
<style>
  /* 全社マップの「新規プロダクト」島の位置（全画面に対する割合） */
  :root{ --tx:73.2%; --ty:59.6%; --dur:7s; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#140e2a;overflow:hidden;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Segoe UI",system-ui,sans-serif;}
  .stage{position:fixed;inset:0;overflow:hidden;}
  .layer{position:absolute;inset:0;background-size:cover;background-position:center;will-change:transform,opacity;}
  .org{background-image:url("org-screen.png");transform-origin:var(--tx) var(--ty);animation:orgcam var(--dur) cubic-bezier(.6,.02,.25,1) infinite;}
  .field{background-image:url("main-screen.png");transform-origin:center;opacity:0;animation:fieldin var(--dur) cubic-bezier(.6,.02,.25,1) infinite;}
  .vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 220px 60px #0a0618cc;}

  /* フォーカスリング & タップ表示（ターゲット島） */
  .ring{position:absolute;left:var(--tx);top:var(--ty);width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;
    border:3px solid #ffd45c;box-shadow:0 0 0 3px #ffd45c44, 0 0 30px #ffd45caa;opacity:0;animation:ringa var(--dur) ease-in-out infinite;}
  .ring::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px dashed #ffd45c88;animation:spin 3s linear infinite;}
  .tap{position:absolute;left:var(--tx);top:var(--ty);width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
    background:#fff;opacity:0;animation:tap var(--dur) ease-out infinite;}

  /* キャプション */
  .cap{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:10;white-space:nowrap;
    font-size:15px;font-weight:900;color:#fdf6ec;background:#1f1942e6;border:2px solid #4a3d7a;border-radius:999px;
    padding:9px 20px;box-shadow:0 4px 0 #00000055;opacity:0;}
  .cap b{color:#ffd45c}
  .c1{animation:c1 var(--dur) ease-in-out infinite}
  .c2{animation:c2 var(--dur) ease-in-out infinite}
  .c3{animation:c3 var(--dur) ease-in-out infinite}
  .c4{animation:c4 var(--dur) ease-in-out infinite}
  /* 上部のステップインジケータ */
  .steps{position:absolute;left:50%;top:22px;transform:translateX(-50%);z-index:10;display:flex;gap:8px;
    background:#1f1942cc;border:2px solid #4a3d7a;border-radius:999px;padding:7px 14px;font-size:11.5px;font-weight:800;color:#b9add0}
  .steps .s{opacity:.5}.steps .sep{color:#6a5da0}
  .badge{position:absolute;left:18px;top:18px;z-index:10;font-size:12px;font-weight:900;color:#d9ccf5;
    background:#1f1942cc;border:2px solid #4a3d7a;border-radius:10px;padding:6px 12px}

  @keyframes orgcam{
    0%   {transform:scale(1);   opacity:1}
    13%  {transform:scale(1);   opacity:1}
    46%  {transform:scale(3.4); opacity:1}
    60%  {transform:scale(3.4); opacity:1}
    72%  {transform:scale(4.1); opacity:0}
    100% {transform:scale(1);   opacity:0}
  }
  @keyframes fieldin{
    0%   {opacity:0; transform:scale(1.12)}
    56%  {opacity:0; transform:scale(1.12)}
    72%  {opacity:1; transform:scale(1.0)}
    93%  {opacity:1; transform:scale(1.0)}
    100% {opacity:0; transform:scale(1.12)}
  }
  @keyframes ringa{
    0%,12%{opacity:0;transform:scale(1.5)}
    19%   {opacity:1;transform:scale(1.25)}
    46%   {opacity:1;transform:scale(1.0)}
    58%   {opacity:.9;transform:scale(.82)}
    70%   {opacity:0;transform:scale(.7)}
    100%  {opacity:0}
  }
  @keyframes tap{
    0%,8%{opacity:0;transform:scale(.4)}
    10%  {opacity:.9;transform:scale(.6)}
    16%  {opacity:0;transform:scale(2.4)}
    100% {opacity:0}
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes c1{0%,2%{opacity:0}5%,13%{opacity:1}17%{opacity:0}100%{opacity:0}}
  @keyframes c2{0%,16%{opacity:0}21%,46%{opacity:1}51%{opacity:0}100%{opacity:0}}
  @keyframes c3{0%,50%{opacity:0}55%,64%{opacity:1}69%{opacity:0}100%{opacity:0}}
  @keyframes c4{0%,68%{opacity:0}73%,93%{opacity:1}98%{opacity:0}100%{opacity:0}}

  /* ===== WebGL没入感レイヤー（モックアップ用） ===== */
  body::before{content:"";position:fixed;inset:-18%;z-index:0;pointer-events:none;
    background:
      radial-gradient(circle at 18% 18%,#6cc6ff22 0 8%,transparent 24%),
      radial-gradient(circle at 78% 12%,#b39dff2a 0 10%,transparent 30%),
      radial-gradient(circle at 62% 78%,#ff7e8b1f 0 9%,transparent 28%),
      conic-gradient(from 210deg at 50% 48%,transparent 0 18deg,#58e0b010 28deg,transparent 46deg,#ffd45c0d 70deg,transparent 98deg);
    filter:blur(8px) saturate(1.25);animation:auroraDrift 18s ease-in-out infinite alternate;}
  body::after{content:"";position:fixed;inset:0;z-index:80;pointer-events:none;mix-blend-mode:screen;opacity:.34;
    background:
      repeating-linear-gradient(0deg,transparent 0 5px,#ffffff08 6px,transparent 7px),
      linear-gradient(90deg,transparent,#6cc6ff10 50%,transparent);
    animation:holoScan 7s linear infinite;}
  @keyframes auroraDrift{0%{transform:translate3d(-2%,-1%,0) rotate(.5deg) scale(1)}100%{transform:translate3d(2%,1.4%,0) rotate(-.7deg) scale(1.05)}}
  @keyframes holoScan{0%{background-position:0 0,-120vw 0}100%{background-position:0 54px,120vw 0}}
  .app{z-index:1;isolation:isolate;perspective:1400px;}
  .webgl-stage{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .webgl-stage .starfield{position:absolute;inset:-10%;opacity:.55;background-image:
      radial-gradient(circle,#ffffffaa 0 1px,transparent 1.4px),
      radial-gradient(circle,#6cc6ffaa 0 1px,transparent 1.6px),
      radial-gradient(circle,#ffd45c88 0 1px,transparent 1.5px);
    background-size:120px 120px,190px 190px,260px 260px;background-position:0 0,45px 80px,100px 30px;
    transform:translateZ(-240px);animation:starParallax 38s linear infinite;}
  .webgl-stage .depth-grid{position:absolute;left:-10%;right:-10%;bottom:-16%;height:52%;opacity:.42;
    background:
      linear-gradient(#6cc6ff22 1px,transparent 1px),linear-gradient(90deg,#6cc6ff22 1px,transparent 1px);
    background-size:52px 52px;transform:perspective(760px) rotateX(64deg);transform-origin:50% 100%;
    filter:drop-shadow(0 0 14px #6cc6ff55);animation:gridRun 2.8s linear infinite;}
  .webgl-stage .light-beam{position:absolute;top:-18%;width:24%;height:82%;background:linear-gradient(180deg,#6cc6ff2f,transparent 72%);
    filter:blur(18px);opacity:.58;transform-origin:50% 0;mix-blend-mode:screen;}
  .webgl-stage .light-beam.a{left:12%;transform:rotate(18deg);animation:beamSweep 9s ease-in-out infinite alternate;}
  .webgl-stage .light-beam.b{right:6%;background:linear-gradient(180deg,#ff7e8b25,transparent 70%);transform:rotate(-22deg);animation:beamSweep 11s ease-in-out infinite alternate-reverse;}
  .webgl-stage .particle{position:absolute;width:7px;height:7px;border-radius:50%;background:#7bdcff;box-shadow:0 0 18px #7bdcff;opacity:.7;animation:particleFloat var(--d,10s) ease-in-out infinite alternate;}
  .webgl-stage .particle:nth-child(5){left:16%;top:28%;--d:8s}.webgl-stage .particle:nth-child(6){left:82%;top:34%;--d:12s;background:#ffd45c;box-shadow:0 0 18px #ffd45c}.webgl-stage .particle:nth-child(7){left:58%;top:18%;--d:10s;background:#b39dff;box-shadow:0 0 18px #b39dff}.webgl-stage .particle:nth-child(8){left:32%;top:76%;--d:13s;background:#58e0b0;box-shadow:0 0 18px #58e0b0}
  @keyframes starParallax{to{background-position:320px 180px,420px 260px,500px 210px}}
  @keyframes gridRun{to{background-position:0 52px,52px 0}}
  @keyframes beamSweep{to{transform:rotate(var(--r,-10deg)) translateX(4%)}}
  @keyframes particleFloat{to{transform:translate3d(28px,-46px,0) scale(1.45);opacity:.25}}
  .topbar,.subbar,.actionbar{backdrop-filter:blur(18px) saturate(1.35);}
  .brand,.stat,.subbar,.action,.focus,.board{box-shadow:0 14px 36px #0008,0 0 0 1px #ffffff10 inset,0 0 34px #6cc6ff12;}
  .board{transform:rotateX(.8deg);background:linear-gradient(180deg,#0f1830aa,#110d24ee);border-color:#7bdcff55;box-shadow:0 22px 70px #000b,0 0 0 1px #ffffff12 inset,0 0 46px #6cc6ff22;}
  .board::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 50% 18%,transparent 0 42%,#05040f66 100%);mix-blend-mode:multiply;}
  .board::after{content:"WEBGL RENDER TARGET / DEPTH + BLOOM + PARTICLE FX";position:absolute;right:16px;bottom:14px;z-index:90;font-size:10px;font-weight:900;letter-spacing:1.6px;color:#7bdcff;background:#081225cc;border:1px solid #7bdcff66;border-radius:999px;padding:6px 12px;box-shadow:0 0 18px #6cc6ff44;}
  .watermark{color:#cfefff;text-shadow:0 0 12px #6cc6ffaa;}

</style>
</head>
<body>
<div class="webgl-stage" aria-hidden="true"><div class="starfield"></div><div class="depth-grid"></div><div class="light-beam a"></div><div class="light-beam b"></div><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span></div>
  <div class="stage">
    <div class="layer org"></div>
    <div class="layer field"></div>
    <div class="ring"></div>
    <div class="tap"></div>
    <div class="vig"></div>

    <div class="badge">🎬 ドリルダウン遷移（ループ再生）</div>
    <div class="steps"><span class="s">🌏 業界</span><span class="sep">▸</span><span class="s">🗺 全社</span><span class="sep">▸</span><span class="s">🏢 部署</span><span class="sep">▸</span><span class="s">💻 現場</span></div>

    <div class="cap c1">① <b>全社マップ</b>：全チームを俯瞰</div>
    <div class="cap c2">② <b>新規プロダクト</b> の島をタップ → ズームイン</div>
    <div class="cap c3">③ ドリルダウン中… <b>カメラが島へ寄る</b></div>
    <div class="cap c4">④ <b>チームの現場</b>（能動操作フェーズ）へ着地</div>
  </div>
</body>
</html>
