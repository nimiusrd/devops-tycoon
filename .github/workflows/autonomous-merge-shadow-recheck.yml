name: Autonomous Merge Shadow Recheck

on:
  workflow_call:
    inputs:
      prs:
        description: JSON array of open PR snapshots to re-evaluate
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  recheck:
    strategy:
      fail-fast: false
      # The caller serializes batches; cap PR-level jobs here so the bound
      # applies to the matrix that actually performs fetches and API calls.
      max-parallel: 8
      matrix:
        pr: ${{ fromJSON(inputs.prs) }}
    name: 'Recheck PR #${{ matrix.pr.number }} after base push'
    concurrency:
      group: autonomous-merge-shadow-pr-${{ matrix.pr.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Invalidate previous shadow result before recheck
        id: invalidate_previous_result
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr.number }}
          BASE_REF_NAME: ${{ matrix.pr.base_ref_name }}
          BASE_SHA: ${{ matrix.pr.base_sha }}
          HEAD_SHA: ${{ matrix.pr.head_sha }}
        run: |
          set -euo pipefail

          result_pointer_label_prefix='autonomous-merge-shadow-result-id-'

          find_persisted_shadow_result_comment_id() {
            local labels_json
            labels_json="$(gh api \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels?per_page=100")"
            local pointer_count
            pointer_count="$(jq --arg prefix "${result_pointer_label_prefix}" \
              '[.[] | select(.name | startswith($prefix))] | length' <<<"${labels_json}")"
            if (( pointer_count > 1 )); then
              echo "Multiple shadow result pointer labels found for PR #${PR_NUMBER}" >&2
              return 1
            fi
            if (( pointer_count == 0 )); then
              return 0
            fi
            local label_name
            label_name="$(jq -r --arg prefix "${result_pointer_label_prefix}" \
              '[.[] | select(.name | startswith($prefix))][0].name | ltrimstr($prefix)' <<<"${labels_json}")"
            if [[ ! "${label_name}" =~ ^[0-9]+$ ]]; then
              echo "Invalid shadow result pointer label for PR #${PR_NUMBER}" >&2
              return 1
            fi
            local comment_json
            if ! comment_json="$(gh api \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${label_name}")"; then
              echo "Shadow result pointer comment ${label_name} could not be read" >&2
              return 1
            fi
            if ! jq -e \
              --arg comment_id "${label_name}" \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg pr_number "${PR_NUMBER}" \
              '((.id | tostring) == $comment_id) and
               (.user.login == "github-actions[bot]") and
               (.body | contains("<!-- autonomous-merge-shadow-result -->")) and
               (.issue_url | endswith("/repos/" + $repository + "/issues/" + $pr_number))' \
              <<<"${comment_json}" >/dev/null; then
              echo "Shadow result pointer comment ${label_name} is not a valid result for PR #${PR_NUMBER}" >&2
              return 1
            fi
            printf '%s\n' "${label_name}"
          }

          persist_shadow_result_comment_id() {
            local comment_id="$1"
            if [[ ! "${comment_id}" =~ ^[0-9]+$ ]]; then
              echo "Invalid shadow result comment id: ${comment_id}" >&2
              return 1
            fi
            local label_name="${result_pointer_label_prefix}${comment_id}"
            if ! gh api "repos/${GITHUB_REPOSITORY}/labels/${label_name}" >/dev/null 2>&1; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" \
                -f "name=${label_name}" \
                -f 'color=5319e7' \
                -f 'description=Internal pointer for the shadow result comment' >/dev/null
            fi
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
              -f "labels[]=${label_name}" >/dev/null
          }

          find_shadow_result_comment_id() {
            # The result comment is updated on every evaluation, so search a
            # bounded number of recently updated pages after checking the
            # persistent pointer label.
            local persisted_comment_id
            if ! persisted_comment_id="$(find_persisted_shadow_result_comment_id)"; then
              return 1
            fi
            if [[ -n "${persisted_comment_id}" ]]; then
              printf '%s\n' "${persisted_comment_id}"
              return 0
            fi
            local page
            for page in 1 2 3; do
              local page_json
              page_json="$(gh api \
                "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100&sort=updated&direction=desc&page=${page}")"
              local comment_id
              comment_id="$(jq -r '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- autonomous-merge-shadow-result -->"))) | .id] | first // empty' <<<"${page_json}")"
              if [[ -n "${comment_id}" ]]; then
                printf '%s\n' "${comment_id}"
                return 0
              fi
              local page_size
              page_size="$(jq 'length' <<<"${page_json}")"
              if (( page_size < 100 )); then
                return 0
              fi
            done
            echo "Could not locate the shadow result comment within the three-page lookup limit" >&2
            return 1
          }

          current_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '[.state, .base.ref, .base.sha, .head.sha, .draft] | @tsv')"
          IFS=$'\t' read -r current_state current_base_ref current_base_sha current_head_sha current_draft <<< "${current_pr}"
          if [[ "${current_state}" != "open" || "${BASE_REF_NAME}" != "main" || \
            "${current_base_ref}" != "main" || "${current_base_ref}" != "${BASE_REF_NAME}" || \
            "${current_base_sha}" != "${BASE_SHA}" || "${current_head_sha}" != "${HEAD_SHA}" || \
            "${current_draft}" != "false" ]]; then
            echo "Skipping stale shadow recheck invalidation for PR #${PR_NUMBER}"
            exit 0
          fi
          existing_comment_id="$(find_shadow_result_comment_id)"
          if [[ -z "${existing_comment_id}" ]]; then
            echo "No previous shadow result exists for PR #${PR_NUMBER}"
            echo 'existing_comment_id=' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          persist_shadow_result_comment_id "${existing_comment_id}"
          printf 'existing_comment_id=%s\n' "${existing_comment_id}" >> "${GITHUB_OUTPUT}"
          report_body="$(cat <<EOF
          ## Autonomous Merge Shadow Mode

          > 最新のbase push後状態を再評価中です。前回のShadow Mode判定は無効化されました。

          | 指標 | 値 |
          | --- | --- |
          | Decision | \`HUMAN_REVIEW_REQUIRED\` |
          | Reason | \`EVALUATION_IN_PROGRESS\` |
          | Comparison base SHA | \`${BASE_SHA}\` |
          | Head SHA | \`${HEAD_SHA}\` |
          EOF
          )"
          full_body=$'<!-- autonomous-merge-shadow-result -->\n\n'"${report_body}"
          payload="$(jq -n --arg body "${full_body}" '{body: $body}')"
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_comment_id}" \
            --input - <<<"${payload}" >/dev/null

      - name: Re-evaluate open PR against current base
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          PR_NUMBER: ${{ matrix.pr.number }}
          BASE_REF_NAME: ${{ matrix.pr.base_ref_name }}
          BASE_SHA: ${{ matrix.pr.base_sha }}
          HEAD_SHA: ${{ matrix.pr.head_sha }}
          EXISTING_COMMENT_ID: ${{ steps.invalidate_previous_result.outputs.existing_comment_id }}
        run: |
          set -euo pipefail
          git_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          write_gitlinks() {
            local git_dir="$1"
            local tree_sha="$2"
            local output="$3"
            git -C "${git_dir}" ls-tree -r -z --full-tree "${tree_sha}" |
              while IFS= read -r -d '' entry; do
                local metadata="${entry%%$'\t'*}"
                local relative_path="${entry#*$'\t'}"
                if [[ "${metadata}" == 160000\ commit\ * ]]; then
                  printf '%s\t%s\0' "${metadata##* }" "${relative_path}"
                fi
              done > "${output}"
          }

          write_evaluation_failure_report() {
            local report_file="$1"
            local comparison_base_sha="$2"
            local head_sha="$3"
            {
              printf '%s\n' '## Autonomous Merge Shadow Mode'
              printf '%s\n' ''
              printf '%s\n' '> Base push recheck: the Shadow Mode evaluator could not complete. Human review is required.'
              printf '%s\n' ''
              printf '%s\n' '| 指標 | 値 |' '| --- | --- |' '| Decision | `HUMAN_REVIEW_REQUIRED` |' '| Reason | `EVALUATION_FAILED` |' '| PR Risk | `N/A` |'
              printf '| Comparison base SHA | `%s` |\n' "${comparison_base_sha}"
              printf '| Head SHA | `%s` |\n' "${head_sha}"
            } > "${report_file}"
          }

          result_pointer_label_prefix='autonomous-merge-shadow-result-id-'

          persist_shadow_result_comment_id() {
            local comment_id="$1"
            local target_pr_number="$2"
            if [[ ! "${comment_id}" =~ ^[0-9]+$ ]]; then
              echo "Invalid shadow result comment id: ${comment_id}" >&2
              return 1
            fi
            local label_name="${result_pointer_label_prefix}${comment_id}"
            if ! gh api "repos/${GITHUB_REPOSITORY}/labels/${label_name}" >/dev/null 2>&1; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" \
                -f "name=${label_name}" \
                -f 'color=5319e7' \
                -f 'description=Internal pointer for the shadow result comment' >/dev/null
            fi
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${target_pr_number}/labels" \
              -f "labels[]=${label_name}" >/dev/null
            local labels_json
            labels_json="$(gh api \
              "repos/${GITHUB_REPOSITORY}/issues/${target_pr_number}/labels?per_page=100")"
            while IFS= read -r old_label; do
              [[ -z "${old_label}" || "${old_label}" == "${label_name}" ]] && continue
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/issues/${target_pr_number}/labels/${old_label}" >/dev/null
            done < <(jq -r --arg prefix "${result_pointer_label_prefix}" \
              --arg current "${label_name}" \
              '.[] | .name | select(startswith($prefix) and . != $current)' <<<"${labels_json}")
          }

          publish_report() {
            local pr_number="$1"
            local base_ref_name="$2"
            local base_sha="$3"
            local head_sha="$4"
            local report_file="$5"
            local current_pr
            current_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
              --jq '[.state, .base.ref, .base.sha, .head.sha, .draft] | @tsv')"
            local current_state current_base_ref current_base_sha current_head_sha current_draft
            IFS=$'\t' read -r current_state current_base_ref current_base_sha current_head_sha current_draft <<< "${current_pr}"
            if [[ "${current_state}" != "open" || "${base_ref_name}" != "main" || \
              "${current_base_ref}" != "main" || "${current_base_ref}" != "${base_ref_name}" || \
              "${current_base_sha}" != "${base_sha}" || "${current_head_sha}" != "${head_sha}" || \
              "${current_draft}" != "false" ]]; then
              echo "Skipping stale failure result for PR #${pr_number}"
              return 0
            fi
            local report_body
            report_body="$(cat "${report_file}")"
            if (( ${#report_body} > 60000 )); then
              report_body="${report_body:0:59000}"
              report_body+=$'\n\n_Report truncated to fit the recheck comment limit._'
            fi
            local full_body
            full_body=$'<!-- autonomous-merge-shadow-result -->\n\n'"${report_body}"
            local payload
            payload="$(jq -n --arg body "${full_body}" '{body: $body}')"
            local existing_comment_id="${EXISTING_COMMENT_ID}"
            if [[ -n "${existing_comment_id}" ]]; then
              gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_comment_id}" \
                --input - <<<"${payload}" >/dev/null
            else
              created_comment="$(gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" \
                --input - <<<"${payload}")"
              created_comment_id="$(jq -r '.id // empty' <<<"${created_comment}")"
              persist_shadow_result_comment_id "${created_comment_id}" "${pr_number}"
            fi
          }

          recheck_pr() {
            local pr_number="$1"
            local base_ref_name="$2"
            local base_sha="$3"
            local head_sha="$4"
            local report_dir="reports/pr-${pr_number}"
            local git_dir="${report_dir}/git"
            local trusted_base_dir="${report_dir}/base"
            local comparison_base_dir="${report_dir}/merge-base"
            local head_dir="${report_dir}/head"
            local base_gitlinks="${report_dir}/merge-base.gitlinks"
            local head_gitlinks="${report_dir}/head.gitlinks"
            local base_symlinks="${report_dir}/merge-base.symlinks"
            local head_symlinks="${report_dir}/head.symlinks"
            local report_file="${report_dir}/report.md"

            mkdir -p "${report_dir}"
            git init -q "${git_dir}"
            git -C "${git_dir}" remote add origin "${git_url}"
            # The base is trusted and is fetched with blobs so its local
            # object metadata can be read without lazy-fetching. The PR head
            # remains blobless until its size metadata has passed validation.
            git -C "${git_dir}" -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" \
              fetch --no-tags origin "refs/heads/${base_ref_name}"
            git -C "${git_dir}" -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" \
              fetch --no-tags --filter=blob:none origin "refs/pull/${pr_number}/head"
            git -C "${git_dir}" cat-file -e "${base_sha}^{commit}"
            git -C "${git_dir}" cat-file -e "${head_sha}^{commit}"
            local merge_base_sha
            merge_base_sha="$(git -C "${git_dir}" merge-base "${base_sha}" "${head_sha}")"

            mkdir -p "${trusted_base_dir}" "${comparison_base_dir}" "${head_dir}"
            extract_raw_tree() {
              local tree_sha="$1"
              local output_dir="$2"
              local metadata_source="$3"
              local symlink_manifest="${output_dir}.symlinks"
              local allowed_blob_ids="${output_dir}.allowed-blobs"
              local tree_entries="${output_dir}.tree"
              local raw_blob_ids="${output_dir}.blob-ids"
              local sorted_blob_ids="${output_dir}.sorted-blob-ids"
              local size_map="${output_dir}.sizes"
              local tree_metadata="${output_dir}.metadata.json"
              local snapshot_file_count=0
              local snapshot_total_bytes=0
              local max_snapshot_file_bytes=8000000
              local max_snapshot_total_bytes=64000000
              local max_snapshot_files=50000

              mkdir -p "${output_dir}"
              : > "${symlink_manifest}"
              : > "${allowed_blob_ids}"
              : > "${raw_blob_ids}"

              # ls-tree without -l reads only tree metadata. Keep the producer
              # connected to the bounded loop so an oversized tree is stopped
              # before the full untrusted listing is written.
              if ! git -C "${git_dir}" ls-tree -r -z --full-tree "${tree_sha}" |
                {
                  while IFS= read -r -d '' entry; do
                    snapshot_file_count=$((snapshot_file_count + 1))
                    if (( snapshot_file_count > max_snapshot_files )); then
                      echo "::error::Snapshot file count exceeds ${max_snapshot_files}" >&2
                      exit 1
                    fi
                    printf '%s\0' "${entry}"
                  done
                } > "${tree_entries}"; then
                return 1
              fi

              while IFS= read -r -d '' entry; do
                local metadata="${entry%%$'\t'*}"
                local relative_path="${entry#*$'\t'}"
                local mode object_type object_id
                read -r mode object_type object_id <<< "${metadata}"
                if [[ "${relative_path}" == /* || "${relative_path}" == .. || \
                  "${relative_path}" == ../* || "${relative_path}" == */../* || \
                  "${relative_path}" == */.. ]]; then
                  echo "::error::Invalid tree path: ${relative_path}" >&2
                  return 1
                fi
                case "${mode}" in
                  160000)
                    [[ "${object_type}" == "commit" && "${object_id}" =~ ^[0-9a-f]{40,64}$ ]] || return 1
                    ;;
                  120000|100644|100755)
                    [[ "${object_type}" == "blob" && "${object_id}" =~ ^[0-9a-f]{40,64}$ ]] || return 1
                    printf '%s\n' "${object_id}" >> "${raw_blob_ids}"
                    ;;
                  *)
                    echo "::error::Unsupported tree mode ${mode}: ${relative_path}" >&2
                    return 1
                    ;;
                esac
              done < "${tree_entries}"

              if [[ "${metadata_source}" == "trusted" ]]; then
                LC_ALL=C sort -u "${raw_blob_ids}" > "${sorted_blob_ids}"
                : > "${size_map}"
                if [[ -s "${sorted_blob_ids}" ]]; then
                  # Do not allow a missing trusted object to trigger a lazy
                  # fetch while reading sizes.
                  GIT_NO_LAZY_FETCH=1 git -C "${git_dir}" \
                    cat-file --batch-check='%(objectname) %(objecttype) %(objectsize)' \
                    < "${sorted_blob_ids}" > "${size_map}"
                fi
              elif [[ "${metadata_source}" == "untrusted" ]]; then
                local tree_id
                tree_id="$(git -C "${git_dir}" rev-parse "${tree_sha}^{tree}")"
                gh api "repos/${GITHUB_REPOSITORY}/git/trees/${tree_id}?recursive=1" > "${tree_metadata}"
                jq -e '
                  .truncated == false and
                  all(.tree[]; .type != "blob" or ((.sha | type) == "string" and
                    (.size | type) == "number" and (.size >= 0) and (.size == floor)))
                ' "${tree_metadata}" > /dev/null
                jq -r '.tree[] | select(.type == "blob") | [.sha, (.size | tostring)] | @tsv' \
                  "${tree_metadata}" > "${size_map}"
              else
                echo "::error::Unknown tree metadata source: ${metadata_source}" >&2
                return 1
              fi

              declare -A blob_sizes=()
              if [[ "${metadata_source}" == "trusted" ]]; then
                while read -r object_id object_type object_size; do
                  [[ "${object_id}" =~ ^[0-9a-f]{40,64}$ && "${object_type}" == "blob" && \
                    "${object_size}" =~ ^[0-9]+$ ]] || {
                    echo "::error::Invalid blob size metadata" >&2
                    return 1
                  }
                  blob_sizes["${object_id}"]="${object_size}"
                done < "${size_map}"
              else
                while IFS=$'\t' read -r object_id object_size; do
                  [[ "${object_id}" =~ ^[0-9a-f]{40,64}$ && "${object_size}" =~ ^[0-9]+$ ]] || {
                    echo "::error::Invalid blob size metadata" >&2
                    return 1
                  }
                  blob_sizes["${object_id}"]="${object_size}"
                done < "${size_map}"
              fi

              : > "${tree_entries}.validated"
              while IFS= read -r -d '' entry; do
                local metadata="${entry%%$'\t'*}"
                local relative_path="${entry#*$'\t'}"
                local mode object_type object_id object_size
                read -r mode object_type object_id <<< "${metadata}"
                case "${mode}" in
                  160000)
                    printf '%s %s %s 0\t%s\0' "${mode}" "${object_type}" "${object_id}" \
                      "${relative_path}" >> "${tree_entries}.validated"
                    ;;
                  120000|100644|100755)
                    if [[ -z "${blob_sizes[${object_id}]+present}" ]]; then
                      echo "::error::Blob size metadata is missing: ${relative_path}" >&2
                      return 1
                    fi
                    object_size="${blob_sizes[${object_id}]}"
                    if (( object_size > max_snapshot_file_bytes || \
                      snapshot_total_bytes > max_snapshot_total_bytes - object_size )); then
                      echo "::error::Snapshot blob size exceeds the configured limit: ${relative_path}" >&2
                      return 1
                    fi
                    snapshot_total_bytes=$((snapshot_total_bytes + object_size))
                    printf '%s %s %s %s\t%s\0' "${mode}" "${object_type}" "${object_id}" \
                      "${object_size}" "${relative_path}" >> "${tree_entries}.validated"
                    if [[ "${mode}" != "120000" ]]; then
                      printf '%s\n' "${object_id}" >> "${allowed_blob_ids}"
                    fi
                    ;;
                  *)
                    echo "::error::Unsupported tree mode ${mode}: ${relative_path}" >&2
                    return 1
                    ;;
                esac
              done < "${tree_entries}"
              mv "${tree_entries}.validated" "${tree_entries}"

              if [[ -s "${allowed_blob_ids}" ]]; then
                LC_ALL=C sort -u "${allowed_blob_ids}" |
                  git -C "${git_dir}" -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" \
                    fetch --no-tags --filter=blob:none --stdin origin
              fi
              while IFS= read -r -d '' entry; do
                local metadata="${entry%%$'\t'*}"
                local relative_path="${entry#*$'\t'}"
                local mode object_type object_id object_size
                read -r mode object_type object_id object_size <<< "${metadata}"
                case "${mode}" in
                  160000)
                    continue
                    ;;
                  120000)
                    printf '%s\t%s\0' "${object_id}" "${relative_path}" >> "${symlink_manifest}"
                    ;;
                  100644|100755)
                    local output_path="${output_dir}/${relative_path}"
                    mkdir -p "$(dirname "${output_path}")"
                    git -C "${git_dir}" cat-file blob "${object_id}" > "${output_path}"
                    chmod "${mode#100}" "${output_path}"
                    ;;
                  *)
                    echo "::error::Unsupported tree mode ${mode}: ${relative_path}" >&2
                    return 1
                    ;;
                esac
              done < "${tree_entries}"
            }
            extract_raw_tree "${base_sha}" "${trusted_base_dir}" trusted
            extract_raw_tree "${merge_base_sha}" "${comparison_base_dir}" trusted
            extract_raw_tree "${head_sha}" "${head_dir}" untrusted
            write_gitlinks "${git_dir}" "${merge_base_sha}" "${base_gitlinks}"
            write_gitlinks "${git_dir}" "${head_sha}" "${head_gitlinks}"

            if [[ ! -f "${trusted_base_dir}/.github/autonomous-merge/evaluate.py" || \
              ! -f "${trusted_base_dir}/.github/autonomous-merge/policy.toml" ]]; then
              {
                printf '%s\n' '## Autonomous Merge Shadow Mode'
                printf '%s\n' ''
                printf '%s\n' '> Base push recheck: this PR is awaiting the Shadow Mode evaluator/policy on its base branch.'
                printf '%s\n' ''
                printf '%s\n' '| 指標 | 値 |' '| --- | --- |' '| Decision | `HUMAN_REVIEW_REQUIRED` |' '| Reason | `BOOTSTRAP_BASELINE_MISSING` |' '| PR Risk | `N/A` |'
                printf '| Comparison base SHA | `%s` |\n' "${base_sha}"
              } > "${report_file}"
            else
              local test_log="${report_dir}/evaluator-tests.log"
              set +e
              PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -v \
                -s "${trusted_base_dir}/.github/autonomous-merge" -p 'test_*.py' > "${test_log}" 2>&1
              local test_status=$?
              set -e
              if (( test_status != 0 )); then
                write_evaluation_failure_report "${report_file}" "${merge_base_sha}" "${head_sha}"
              else
                set +e
                python3 -B "${trusted_base_dir}/.github/autonomous-merge/evaluate.py" \
                    --base-dir "${comparison_base_dir}" \
                    --head-dir "${head_dir}" \
                    --policy "${trusted_base_dir}/.github/autonomous-merge/policy.toml" \
                    --trusted-base-dir "${trusted_base_dir}" \
                    --base-gitlinks "${base_gitlinks}" \
                    --head-gitlinks "${head_gitlinks}" \
                    --base-symlinks "${base_symlinks}" \
                    --head-symlinks "${head_symlinks}" \
                    --base-sha "${merge_base_sha}" \
                    --head-sha "${head_sha}" \
                    --format markdown > "${report_file}"
                local evaluation_status=$?
                set -e
                if (( evaluation_status != 0 )); then
                  write_evaluation_failure_report "${report_file}" "${merge_base_sha}" "${head_sha}"
                fi
              fi
            fi

            return 0
          }

          report_file="reports/pr-${PR_NUMBER}/report.md"
          mkdir -p "$(dirname "${report_file}")"
          set +e
          (
            set -e
            recheck_pr "${PR_NUMBER}" "${BASE_REF_NAME}" "${BASE_SHA}" "${HEAD_SHA}"
          )
          recheck_status=$?
          set -e
          if (( recheck_status != 0 )); then
            echo "::warning::Shadow recheck failed for PR #${PR_NUMBER}"
            write_evaluation_failure_report "${report_file}" "${BASE_SHA}" "${HEAD_SHA}"
          fi
          publish_report "${PR_NUMBER}" "${BASE_REF_NAME}" "${BASE_SHA}" "${HEAD_SHA}" "${report_file}"
