version = 1
name = "DevOps Tycoon"

[setup]
script = """
devcontainer up --workspace-folder "${CODEX_WORKTREE_PATH:-.}"
"""

[[actions]]
name = "開発サーバ"
icon = "run"
command = "devcontainer exec --workspace-folder . npm run dev -- --host 0.0.0.0"

[[actions]]
name = "ユニットテスト"
icon = "test"
command = "devcontainer exec --workspace-folder . npm test"

[[actions]]
name = "E2Eテスト"
icon = "test"
command = "devcontainer exec --workspace-folder . npm run test:e2e -- --workers=1"

[[actions]]
name = "Lint"
icon = "tool"
command = "devcontainer exec --workspace-folder . npm run lint"

[[actions]]
name = "フォーマット確認"
icon = "tool"
command = "devcontainer exec --workspace-folder . npm run format:check"

[[actions]]
name = "ビルド"
icon = "tool"
command = "devcontainer exec --workspace-folder . npm run build"
