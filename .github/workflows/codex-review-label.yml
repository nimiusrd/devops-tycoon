name: Codex review label

on:
  issue_comment:
    types: [created, edited, deleted]
  # コンフリクト中のPRやフォークでも判定を更新するため、pull_request ではなく pull_request_target を使う。
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 再判定するPR番号
        required: true
        type: number

permissions: {}

# オープンな同一リポジトリのPRへ、次のいずれか一つを付ける。
# codex/指摘なし / codex/指摘あり / codex/未レビュー・レビュー中
# フォークは外す。閉じたPRは変えない。判定は scripts/codex-review-label.mjs。

jobs:
  sync:
    name: Sync label with Codex review state
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]') ||
      (github.event_name == 'pull_request_target' &&
       (github.event.action == 'synchronize' ||
        github.event.action == 'reopened' ||
        github.event.action == 'opened' ||
        github.event.action == 'ready_for_review' ||
        (github.event.action == 'edited' && github.event.changes.base) ||
        github.event.label.name == 'codex/指摘なし' ||
        github.event.label.name == 'codex/指摘あり' ||
        github.event.label.name == 'codex/未レビュー・レビュー中')) ||
      (github.event_name == 'pull_request_review' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.review.user.login == 'chatgpt-codex-connector[bot]')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    concurrency:
      group: codex-review-label-${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: false
    steps:
      # PRのコードはチェックアウトも実行もせず、履歴の判定にだけgitを使う。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Evaluate Codex review state and update label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}
        run: node scripts/codex-review-label.mjs
