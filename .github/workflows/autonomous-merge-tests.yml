name: Autonomous Merge Tests

on:
  pull_request:
    paths:
      - '.github/autonomous-merge/**'
      - '.github/workflows/autonomous-merge-*.yml'
  push:
    branches: [main]
    paths:
      - '.github/autonomous-merge/**'
      - '.github/workflows/autonomous-merge-*.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test metadata collection and decisions
        run: python3 -B -m unittest discover -s .github/autonomous-merge -p 'test_*.py'
