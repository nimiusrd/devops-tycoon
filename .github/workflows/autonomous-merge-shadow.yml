name: Autonomous Merge Shadow

# PRの内容を採点するだけの観測workflow。baseブランチ側の定義で実行する。
# required checkにはせず、merge APIも呼ばないため、Shadow Mode中はPRを止めない。
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

concurrency:
  group: autonomous-merge-shadow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    if: github.event_name == 'pull_request_target'
    name: PR risk (shadow only)
    concurrency:
      group: autonomous-merge-shadow-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      # policy/evaluatorはPR headではなく、必ずPR base SHAから取得する。
      - name: Checkout PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 0
          persist-credentials: false

      - name: Check base evaluator and policy
        id: base_assets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ ! -f base/.github/autonomous-merge/evaluate.py || ! -f base/.github/autonomous-merge/policy.toml ]]; then
            echo 'available=false' >> "${GITHUB_OUTPUT}"
            {
              echo '## Autonomous Merge Shadow Mode'
              echo
              echo '| 指標 | 値 |'
              echo '| --- | --- |'
              echo '| Decision | `HUMAN_REVIEW_REQUIRED` |'
              echo '| Reason | `BOOTSTRAP_BASELINE_MISSING` |'
              echo '| PR Risk | `N/A` |'
              echo '| Project Health | `N/A` |'
              echo
              echo "> base SHA ${BASE_SHA} does not contain the evaluator/policy yet."
              echo '> This bootstrap PR installs the Shadow Mode assets. Human review is required before merge; numeric evaluation starts on the next PR after merge.'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          echo 'available=true' >> "${GITHUB_OUTPUT}"
          echo "Using evaluator and policy from base SHA ${BASE_SHA}"

      - name: Prepare merge-base snapshot
        if: steps.base_assets.outputs.available == 'true'
        id: merge_base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C base -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch --no-tags --filter=blob:none origin "refs/pull/${PR_NUMBER}/head"
          if ! git -C base cat-file -e "${HEAD_SHA}^{commit}"; then
            git -C base -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch --no-tags --filter=blob:none origin "${HEAD_SHA}"
          fi
          git -C base cat-file -e "${HEAD_SHA}^{commit}"
          MERGE_BASE_SHA="$(git -C base merge-base "${BASE_SHA}" "${HEAD_SHA}")"
          extract_raw_tree() {
            local git_dir="$1"
            local tree_sha="$2"
            local output_dir="$3"
            local tree_entries="${RUNNER_TEMP}/autonomous-merge-shadow-tree-${tree_sha}.ls-tree"
            local symlink_manifest="${output_dir}.symlinks"
            local snapshot_file_count=0
            local snapshot_total_bytes=0
            local max_snapshot_file_bytes=8000000
            local max_snapshot_total_bytes=64000000
            local max_snapshot_files=50000

            mkdir -p "${output_dir}"
            : > "${symlink_manifest}"
            git -C "${git_dir}" ls-tree -r -l -z --full-tree "${tree_sha}" > "${tree_entries}"
            while IFS= read -r -d '' entry; do
              local metadata="${entry%%$'\t'*}"
              local relative_path="${entry#*$'\t'}"
              local mode object_type object_id object_size
              read -r mode object_type object_id object_size <<< "${metadata}"
              if [[ "${relative_path}" == /* || "${relative_path}" == .. || \
                "${relative_path}" == ../* || "${relative_path}" == */../* || \
                "${relative_path}" == */.. ]]; then
                echo "::error::Invalid tree path: ${relative_path}" >&2
                return 1
              fi
              snapshot_file_count=$((snapshot_file_count + 1))
              if (( snapshot_file_count > max_snapshot_files )); then
                echo "::error::Snapshot file count exceeds ${max_snapshot_files}" >&2
                return 1
              fi
              case "${mode}" in
                160000)
                  [[ "${object_type}" == "commit" ]] || return 1
                  continue
                  ;;
                120000|100644|100755)
                  [[ "${object_type}" == "blob" && "${object_size}" =~ ^[0-9]+$ ]] || return 1
                  if (( object_size > max_snapshot_file_bytes || \
                    snapshot_total_bytes > max_snapshot_total_bytes - object_size )); then
                    echo "::error::Snapshot blob size exceeds the configured limit: ${relative_path}" >&2
                    return 1
                  fi
                  snapshot_total_bytes=$((snapshot_total_bytes + object_size))
                  if [[ "${mode}" == "120000" ]]; then
                    printf '%s\t%s\0' "${object_id}" "${relative_path}" >> "${symlink_manifest}"
                    continue
                  fi
                  local output_path="${output_dir}/${relative_path}"
                  mkdir -p "$(dirname "${output_path}")"
                  git -C "${git_dir}" cat-file blob "${object_id}" > "${output_path}"
                  chmod "${mode#100}" "${output_path}"
                  ;;
                *)
                  echo "::error::Unsupported tree mode ${mode}: ${relative_path}" >&2
                  return 1
                  ;;
              esac
            done < "${tree_entries}"
            rm -f "${tree_entries}"
          }
          mkdir -p merge-base head
          extract_raw_tree base "${MERGE_BASE_SHA}" merge-base
          extract_raw_tree base "${HEAD_SHA}" head
          echo "sha=${MERGE_BASE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "Using merge base SHA ${MERGE_BASE_SHA} for the comparison"

      - name: Prepare gitlink manifests
        if: steps.base_assets.outputs.available == 'true'
        id: gitlinks
        env:
          MERGE_BASE_SHA: ${{ steps.merge_base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          write_gitlinks() {
            local tree_sha="$1"
            local output="$2"
            git -C base ls-tree -r -z --full-tree "${tree_sha}" |
              while IFS= read -r -d '' entry; do
                local metadata="${entry%%$'\t'*}"
                local relative_path="${entry#*$'\t'}"
                if [[ "${metadata}" == 160000\ commit\ * ]]; then
                  printf '%s\t%s\0' "${metadata##* }" "${relative_path}"
                fi
              done > "${output}"
          }
          write_gitlinks "${MERGE_BASE_SHA}" merge-base.gitlinks
          write_gitlinks "${HEAD_SHA}" head.gitlinks

      - name: Test base evaluator
        if: steps.base_assets.outputs.available == 'true'
        id: base_tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest discover -v -s base/.github/autonomous-merge -p 'test_*.py'

      - name: Evaluate PR risk (non-blocking shadow mode)
        if: steps.base_assets.outputs.available == 'true'
        id: evaluate_risk
        continue-on-error: true
        env:
          MERGE_BASE_SHA: ${{ steps.merge_base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 -B base/.github/autonomous-merge/evaluate.py \
            --base-dir merge-base \
            --head-dir head \
            --policy base/.github/autonomous-merge/policy.toml \
            --trusted-base-dir base \
            --base-gitlinks merge-base.gitlinks \
            --head-gitlinks head.gitlinks \
            --base-symlinks merge-base.symlinks \
            --head-symlinks head.symlinks \
            --base-sha "${MERGE_BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --format markdown | tee shadow-report.md | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Update PR shadow result comment
        if: >-
          always() && steps.base_assets.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE_SHA: ${{ steps.merge_base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVALUATION_OUTCOME: ${{ steps.evaluate_risk.outcome }}
          MERGE_BASE_OUTCOME: ${{ steps.merge_base.outcome }}
          GITLINKS_OUTCOME: ${{ steps.gitlinks.outcome }}
          BASE_TESTS_OUTCOME: ${{ steps.base_tests.outcome }}
        run: |
          set -euo pipefail
          if [[ "${EVALUATION_OUTCOME}" != "success" || \
            "${MERGE_BASE_OUTCOME}" == "failure" || \
            "${GITLINKS_OUTCOME}" == "failure" || \
            "${BASE_TESTS_OUTCOME}" == "failure" ]]; then
            comparison_base_sha="${MERGE_BASE_SHA:-N/A}"
            report_body="$(cat <<EOF
          ## Autonomous Merge Shadow Mode

          > 評価パイプラインが完了できませんでした。人手レビューが必要です。

          | 指標 | 値 |
          | --- | --- |
          | Decision | \`HUMAN_REVIEW_REQUIRED\` |
          | Reason | \`EVALUATION_FAILED\` |
          | PR Risk | \`N/A\` |
          | Comparison base SHA | \`${comparison_base_sha}\` |
          | Head SHA | \`${HEAD_SHA}\` |
          EOF
            )"
            printf '%s\n' "${report_body}" >> "${GITHUB_STEP_SUMMARY}"
          else
            report_body="$(cat shadow-report.md)"
          fi
          if (( ${#report_body} > 60000 )); then
            report_body="${report_body:0:59000}"
            report_body+=$'\n\n_Report truncated to fit the shadow result comment limit._'
          fi
          current_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '[.state, .base.sha, .head.sha] | @tsv')"
          IFS=$'\t' read -r current_state current_base_sha current_head_sha <<< "${current_pr}"
          if [[ "${current_state}" != "open" || "${current_base_sha}" != "${BASE_SHA}" || \
            "${current_head_sha}" != "${HEAD_SHA}" ]]; then
            echo "Skipping stale shadow result for PR #${PR_NUMBER}"
            exit 0
          fi
          full_body=$'<!-- autonomous-merge-shadow-result -->\n\n'"${report_body}"
          payload="$(jq -n --arg body "${full_body}" '{body: $body}')"
          existing_comment_id="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- autonomous-merge-shadow-result -->"))) | .id' | tail -n 1)"
          if [[ -n "${existing_comment_id}" ]]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_comment_id}" \
              --input - <<<"${payload}" >/dev/null
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --input - <<<"${payload}" >/dev/null
          fi

  list-open-prs:
    if: github.event_name == 'push'
    name: List open PRs for base recheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.collect.outputs.prs }}
    steps:
      - name: Collect open PR snapshots
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_list="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '.[] | {number: .number, base_ref_name: .base.ref, base_sha: .base.sha, head_sha: .head.sha}' |
            jq -sc '.')"
          printf 'prs=%s\n' "${pr_list}" >> "${GITHUB_OUTPUT}"

  recheck-open-prs:
    needs: list-open-prs
    if: github.event_name == 'push' && needs.list-open-prs.outputs.prs != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.list-open-prs.outputs.prs) }}
    name: 'Recheck PR #${{ matrix.pr.number }} after base push'
    concurrency:
      group: autonomous-merge-shadow-pr-${{ matrix.pr.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Re-evaluate open PRs against current base
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          PR_NUMBER: ${{ matrix.pr.number }}
          BASE_REF_NAME: ${{ matrix.pr.base_ref_name }}
          BASE_SHA: ${{ matrix.pr.base_sha }}
          HEAD_SHA: ${{ matrix.pr.head_sha }}
        run: |
          set -euo pipefail
          git_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          write_gitlinks() {
            local git_dir="$1"
            local tree_sha="$2"
            local output="$3"
            git -C "${git_dir}" ls-tree -r -z --full-tree "${tree_sha}" |
              while IFS= read -r -d '' entry; do
                local metadata="${entry%%$'\t'*}"
                local relative_path="${entry#*$'\t'}"
                if [[ "${metadata}" == 160000\ commit\ * ]]; then
                  printf '%s\t%s\0' "${metadata##* }" "${relative_path}"
                fi
              done > "${output}"
          }

          write_evaluation_failure_report() {
            local report_file="$1"
            local comparison_base_sha="$2"
            local head_sha="$3"
            {
              printf '%s\n' '## Autonomous Merge Shadow Mode'
              printf '%s\n' ''
              printf '%s\n' '> Base push recheck: the Shadow Mode evaluator could not complete. Human review is required.'
              printf '%s\n' ''
              printf '%s\n' '| 指標 | 値 |' '| --- | --- |' '| Decision | `HUMAN_REVIEW_REQUIRED` |' '| Reason | `EVALUATION_FAILED` |' '| PR Risk | `N/A` |'
              printf '| Comparison base SHA | `%s` |\n' "${comparison_base_sha}"
              printf '| Head SHA | `%s` |\n' "${head_sha}"
            } > "${report_file}"
          }

          upsert_failure_comment() {
            local pr_number="$1"
            local base_sha="$2"
            local head_sha="$3"
            local current_pr
            current_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
              --jq '[.state, .base.sha, .head.sha] | @tsv')"
            local current_state current_base_sha current_head_sha
            IFS=$'\t' read -r current_state current_base_sha current_head_sha <<< "${current_pr}"
            if [[ "${current_state}" != "open" || "${current_base_sha}" != "${base_sha}" || \
              "${current_head_sha}" != "${head_sha}" ]]; then
              echo "Skipping stale failure result for PR #${pr_number}"
              return 0
            fi
            local report_body
            report_body="$(cat <<EOF
          ## Autonomous Merge Shadow Mode

          > Base push recheck could not complete. Human review is required.

          | 指標 | 値 |
          | --- | --- |
          | Decision | \`HUMAN_REVIEW_REQUIRED\` |
          | Reason | \`EVALUATION_FAILED\` |
          | PR Risk | \`N/A\` |
          | Base branch SHA | \`${base_sha}\` |
          | Head SHA | \`${head_sha}\` |
          EOF
            )"
            local full_body
            full_body=$'<!-- autonomous-merge-shadow-result -->\n\n'"${report_body}"
            local payload
            payload="$(jq -n --arg body "${full_body}" '{body: $body}')"
            local existing_comment_id
            existing_comment_id="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- autonomous-merge-shadow-result -->"))) | .id' | tail -n 1)"
            if [[ -n "${existing_comment_id}" ]]; then
              gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_comment_id}" \
                --input - <<<"${payload}" >/dev/null
            else
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" \
                --input - <<<"${payload}" >/dev/null
            fi
          }

          recheck_pr() {
            local pr_number="$1"
            local base_ref_name="$2"
            local base_sha="$3"
            local head_sha="$4"
            local report_dir="reports/pr-${pr_number}"
            local git_dir="${report_dir}/git"
            local trusted_base_dir="${report_dir}/base"
            local comparison_base_dir="${report_dir}/merge-base"
            local head_dir="${report_dir}/head"
            local base_gitlinks="${report_dir}/merge-base.gitlinks"
            local head_gitlinks="${report_dir}/head.gitlinks"
            local base_symlinks="${report_dir}/merge-base.symlinks"
            local head_symlinks="${report_dir}/head.symlinks"
            local report_file="${report_dir}/report.md"

            mkdir -p "${report_dir}"
            git init -q "${git_dir}"
            git -C "${git_dir}" remote add origin "${git_url}"
            git -C "${git_dir}" -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" \
              fetch --no-tags --filter=blob:none origin "refs/heads/${base_ref_name}" "refs/pull/${pr_number}/head"
            git -C "${git_dir}" cat-file -e "${base_sha}^{commit}"
            git -C "${git_dir}" cat-file -e "${head_sha}^{commit}"
            local merge_base_sha
            merge_base_sha="$(git -C "${git_dir}" merge-base "${base_sha}" "${head_sha}")"

            mkdir -p "${trusted_base_dir}" "${comparison_base_dir}" "${head_dir}"
            extract_raw_tree() {
              local tree_sha="$1"
              local output_dir="$2"
              local tree_entries="${RUNNER_TEMP}/autonomous-merge-shadow-tree-pr-${pr_number}-${tree_sha}.ls-tree"
              local symlink_manifest="${output_dir}.symlinks"
              local snapshot_file_count=0
              local snapshot_total_bytes=0
              local max_snapshot_file_bytes=8000000
              local max_snapshot_total_bytes=64000000
              local max_snapshot_files=50000

              mkdir -p "${output_dir}"
              : > "${symlink_manifest}"
              git -C "${git_dir}" ls-tree -r -l -z --full-tree "${tree_sha}" > "${tree_entries}"
              while IFS= read -r -d '' entry; do
                local metadata="${entry%%$'\t'*}"
                local relative_path="${entry#*$'\t'}"
                local mode object_type object_id object_size
                read -r mode object_type object_id object_size <<< "${metadata}"
                if [[ "${relative_path}" == /* || "${relative_path}" == .. || \
                  "${relative_path}" == ../* || "${relative_path}" == */../* || \
                  "${relative_path}" == */.. ]]; then
                  echo "::error::Invalid tree path: ${relative_path}" >&2
                  return 1
                fi
                snapshot_file_count=$((snapshot_file_count + 1))
                if (( snapshot_file_count > max_snapshot_files )); then
                  echo "::error::Snapshot file count exceeds ${max_snapshot_files}" >&2
                  return 1
                fi
                case "${mode}" in
                  160000)
                    [[ "${object_type}" == "commit" ]] || return 1
                    continue
                    ;;
                  120000|100644|100755)
                    [[ "${object_type}" == "blob" && "${object_size}" =~ ^[0-9]+$ ]] || return 1
                    if (( object_size > max_snapshot_file_bytes || \
                      snapshot_total_bytes > max_snapshot_total_bytes - object_size )); then
                      echo "::error::Snapshot blob size exceeds the configured limit: ${relative_path}" >&2
                      return 1
                    fi
                    snapshot_total_bytes=$((snapshot_total_bytes + object_size))
                    if [[ "${mode}" == "120000" ]]; then
                      printf '%s\t%s\0' "${object_id}" "${relative_path}" >> "${symlink_manifest}"
                      continue
                    fi
                    local output_path="${output_dir}/${relative_path}"
                    mkdir -p "$(dirname "${output_path}")"
                    git -C "${git_dir}" cat-file blob "${object_id}" > "${output_path}"
                    chmod "${mode#100}" "${output_path}"
                    ;;
                  *)
                    echo "::error::Unsupported tree mode ${mode}: ${relative_path}" >&2
                    return 1
                    ;;
                esac
              done < "${tree_entries}"
              rm -f "${tree_entries}"
            }
            extract_raw_tree "${base_sha}" "${trusted_base_dir}"
            extract_raw_tree "${merge_base_sha}" "${comparison_base_dir}"
            extract_raw_tree "${head_sha}" "${head_dir}"
            write_gitlinks "${git_dir}" "${merge_base_sha}" "${base_gitlinks}"
            write_gitlinks "${git_dir}" "${head_sha}" "${head_gitlinks}"

            if [[ ! -f "${trusted_base_dir}/.github/autonomous-merge/evaluate.py" || \
              ! -f "${trusted_base_dir}/.github/autonomous-merge/policy.toml" ]]; then
              {
                printf '%s\n' '## Autonomous Merge Shadow Mode'
                printf '%s\n' ''
                printf '%s\n' '> Base push recheck: this PR is awaiting the Shadow Mode evaluator/policy on its base branch.'
                printf '%s\n' ''
                printf '%s\n' '| 指標 | 値 |' '| --- | --- |' '| Decision | `HUMAN_REVIEW_REQUIRED` |' '| Reason | `BOOTSTRAP_BASELINE_MISSING` |' '| PR Risk | `N/A` |'
                printf '| Comparison base SHA | `%s` |\n' "${base_sha}"
              } > "${report_file}"
            else
              local test_log="${report_dir}/evaluator-tests.log"
              set +e
              PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -v \
                -s "${trusted_base_dir}/.github/autonomous-merge" -p 'test_*.py' > "${test_log}" 2>&1
              local test_status=$?
              set -e
              if (( test_status != 0 )); then
                write_evaluation_failure_report "${report_file}" "${merge_base_sha}" "${head_sha}"
              else
                set +e
                python3 -B "${trusted_base_dir}/.github/autonomous-merge/evaluate.py" \
                    --base-dir "${comparison_base_dir}" \
                    --head-dir "${head_dir}" \
                    --policy "${trusted_base_dir}/.github/autonomous-merge/policy.toml" \
                    --trusted-base-dir "${trusted_base_dir}" \
                    --base-gitlinks "${base_gitlinks}" \
                    --head-gitlinks "${head_gitlinks}" \
                    --base-symlinks "${base_symlinks}" \
                    --head-symlinks "${head_symlinks}" \
                    --base-sha "${merge_base_sha}" \
                    --head-sha "${head_sha}" \
                    --format markdown > "${report_file}"
                local evaluation_status=$?
                set -e
                if (( evaluation_status != 0 )); then
                  write_evaluation_failure_report "${report_file}" "${merge_base_sha}" "${head_sha}"
                fi
              fi
            fi

            local report_body
            report_body="$(cat "${report_file}")"
            if (( ${#report_body} > 60000 )); then
              report_body="${report_body:0:59000}"
              report_body+=$'\n\n_Report truncated to fit the recheck comment limit._'
            fi
            local current_pr
            current_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
              --jq '[.state, .base.sha, .head.sha] | @tsv')"
            local current_state current_base_sha current_head_sha
            IFS=$'\t' read -r current_state current_base_sha current_head_sha <<< "${current_pr}"
            if [[ "${current_state}" != "open" || "${current_base_sha}" != "${base_sha}" || \
              "${current_head_sha}" != "${head_sha}" ]]; then
              echo "Skipping stale shadow result for PR #${pr_number}"
              return 0
            fi
            local full_body
            full_body=$'<!-- autonomous-merge-shadow-result -->\n\n'"${report_body}"
            local payload
            payload="$(jq -n --arg body "${full_body}" '{body: $body}')"
            local existing_comment_id
            existing_comment_id="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- autonomous-merge-shadow-result -->"))) | .id' | tail -n 1)"
            if [[ -n "${existing_comment_id}" ]]; then
              gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_comment_id}" \
                --input - <<<"${payload}" >/dev/null
            else
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" \
                --input - <<<"${payload}" >/dev/null
            fi
            echo "Rechecked PR #${pr_number} against base ${base_sha}"
          }

          set +e
          (
            set -e
            recheck_pr "${PR_NUMBER}" "${BASE_REF_NAME}" "${BASE_SHA}" "${HEAD_SHA}"
          )
          recheck_status=$?
          set -e
          if (( recheck_status != 0 )); then
            echo "::warning::Shadow recheck failed for PR #${PR_NUMBER}"
            upsert_failure_comment "${PR_NUMBER}" "${BASE_SHA}" "${HEAD_SHA}"
          fi
