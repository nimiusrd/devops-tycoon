<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DevOps Tycoon — ドリルダウン遷移演出（全社→チーム現場）</title>
<style>
  /* 全社マップの「新規プロダクト」島の位置（全画面に対する割合） */
  :root{ --tx:73.2%; --ty:59.6%; --dur:7s; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#140e2a;overflow:hidden;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Segoe UI",system-ui,sans-serif;}
  .stage{position:fixed;inset:0;overflow:hidden;}
  .layer{position:absolute;inset:0;background-size:cover;background-position:center;will-change:transform,opacity;}
  .org{background-image:url("org-screen.png");transform-origin:var(--tx) var(--ty);animation:orgcam var(--dur) cubic-bezier(.6,.02,.25,1) infinite;}
  .field{background-image:url("main-screen.png");transform-origin:center;opacity:0;animation:fieldin var(--dur) cubic-bezier(.6,.02,.25,1) infinite;}
  .vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 220px 60px #0a0618cc;}

  /* フォーカスリング & タップ表示（ターゲット島） */
  .ring{position:absolute;left:var(--tx);top:var(--ty);width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;
    border:3px solid #ffd45c;box-shadow:0 0 0 3px #ffd45c44, 0 0 30px #ffd45caa;opacity:0;animation:ringa var(--dur) ease-in-out infinite;}
  .ring::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px dashed #ffd45c88;animation:spin 3s linear infinite;}
  .tap{position:absolute;left:var(--tx);top:var(--ty);width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
    background:#fff;opacity:0;animation:tap var(--dur) ease-out infinite;}

  /* キャプション */
  .cap{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:10;white-space:nowrap;
    font-size:15px;font-weight:900;color:#fdf6ec;background:#1f1942e6;border:2px solid #4a3d7a;border-radius:999px;
    padding:9px 20px;box-shadow:0 4px 0 #00000055;opacity:0;}
  .cap b{color:#ffd45c}
  .c1{animation:c1 var(--dur) ease-in-out infinite}
  .c2{animation:c2 var(--dur) ease-in-out infinite}
  .c3{animation:c3 var(--dur) ease-in-out infinite}
  .c4{animation:c4 var(--dur) ease-in-out infinite}
  /* 上部のステップインジケータ */
  .steps{position:absolute;left:50%;top:22px;transform:translateX(-50%);z-index:10;display:flex;gap:8px;
    background:#1f1942cc;border:2px solid #4a3d7a;border-radius:999px;padding:7px 14px;font-size:11.5px;font-weight:800;color:#b9add0}
  .steps .s{opacity:.5}.steps .sep{color:#6a5da0}
  .badge{position:absolute;left:18px;top:18px;z-index:10;font-size:12px;font-weight:900;color:#d9ccf5;
    background:#1f1942cc;border:2px solid #4a3d7a;border-radius:10px;padding:6px 12px}

  @keyframes orgcam{
    0%   {transform:scale(1);   opacity:1}
    13%  {transform:scale(1);   opacity:1}
    46%  {transform:scale(3.4); opacity:1}
    60%  {transform:scale(3.4); opacity:1}
    72%  {transform:scale(4.1); opacity:0}
    100% {transform:scale(1);   opacity:0}
  }
  @keyframes fieldin{
    0%   {opacity:0; transform:scale(1.12)}
    56%  {opacity:0; transform:scale(1.12)}
    72%  {opacity:1; transform:scale(1.0)}
    93%  {opacity:1; transform:scale(1.0)}
    100% {opacity:0; transform:scale(1.12)}
  }
  @keyframes ringa{
    0%,12%{opacity:0;transform:scale(1.5)}
    19%   {opacity:1;transform:scale(1.25)}
    46%   {opacity:1;transform:scale(1.0)}
    58%   {opacity:.9;transform:scale(.82)}
    70%   {opacity:0;transform:scale(.7)}
    100%  {opacity:0}
  }
  @keyframes tap{
    0%,8%{opacity:0;transform:scale(.4)}
    10%  {opacity:.9;transform:scale(.6)}
    16%  {opacity:0;transform:scale(2.4)}
    100% {opacity:0}
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes c1{0%,2%{opacity:0}5%,13%{opacity:1}17%{opacity:0}100%{opacity:0}}
  @keyframes c2{0%,16%{opacity:0}21%,46%{opacity:1}51%{opacity:0}100%{opacity:0}}
  @keyframes c3{0%,50%{opacity:0}55%,64%{opacity:1}69%{opacity:0}100%{opacity:0}}
  @keyframes c4{0%,68%{opacity:0}73%,93%{opacity:1}98%{opacity:0}100%{opacity:0}}
</style>
</head>
<body>
  <div class="stage">
    <div class="layer org"></div>
    <div class="layer field"></div>
    <div class="ring"></div>
    <div class="tap"></div>
    <div class="vig"></div>

    <div class="badge">🎬 ドリルダウン遷移（ループ再生）</div>
    <div class="steps"><span class="s">🌏 業界</span><span class="sep">▸</span><span class="s">🗺 全社</span><span class="sep">▸</span><span class="s">🏢 部署</span><span class="sep">▸</span><span class="s">💻 現場</span></div>

    <div class="cap c1">① <b>全社マップ</b>：全チームを俯瞰</div>
    <div class="cap c2">② <b>新規プロダクト</b> の島をタップ → ズームイン</div>
    <div class="cap c3">③ ドリルダウン中… <b>カメラが島へ寄る</b></div>
    <div class="cap c4">④ <b>チームの現場</b>（能動操作フェーズ）へ着地</div>
  </div>
</body>
</html>
