name: Autonomous Merge Check Markers

# このworkflowは未観測表示だけを作る。評価はShadow/Labelsのread-only jobが担当。
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: ['CI']
    types: [in_progress]

permissions:
  contents: read

jobs:
  publish-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: autonomous-merge-check-writer
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      checks: write
      actions: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/autonomous-merge
      - name: Mark pending observation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -f .github/autonomous-merge/publish_checks.py ]]; then
            echo '未導入: Check publisherがdefault branchにありません。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 -B .github/autonomous-merge/publish_checks.py --event "$GITHUB_EVENT_PATH"
