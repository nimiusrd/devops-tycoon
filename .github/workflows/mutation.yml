# コアロジック（src/sim / src/state）のミューテーションテスト。
# PR / push の必須ゲートにはしない。手動または週次スケジュールでのみ実行する。
#
# 対象は約 13,000 mutant。単一ジョブや旧 6 シャードでは 180 分上限に当たるため、
# `scripts/mutation-shards.mjs` のディレクトリ／巨大ファイル行レンジ単位で並列する。
# sprint.ts と engine.ts の step/resolveSprint は mutant あたりの壁時計が長く、
# 700 体予算では足りないので関数境界で更に細かく割る。
# カスタム mutate を指定した場合のみ単一ジョブで実行する。
name: Mutation

on:
  schedule:
    # 毎週月曜 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      mutate:
        description: 'mutate パターン（空ならシャード分割でコア全体を実行）'
        required: false
        type: string
        default: ''
      force:
        description: 'incremental キャッシュを無視して再実行する'
        required: false
        type: boolean
        default: false

concurrency:
  group: mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 手動で mutate を指定したときだけ単一ジョブ
  mutation-custom:
    name: Stryker (custom)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mutate != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore Stryker incremental cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental-custom.json
          key: stryker-incremental-custom-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-custom-${{ runner.os }}-
      - name: Run mutation tests
        run: |
          set -euo pipefail
          args=(--incrementalFile reports/stryker-incremental-custom.json --mutate "${MUTATE}")
          if [ "${FORCE}" = "true" ]; then
            args+=(--force)
          fi
          npx stryker run "${args[@]}"
        env:
          FORCE: ${{ inputs.force }}
          MUTATE: ${{ inputs.mutate }}
      - name: Upload mutation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-custom
          path: |
            reports/mutation/
            reports/stryker-incremental-custom.json
          if-no-files-found: warn
          retention-days: 30

  mutation-shard-matrix:
    name: Resolve mutation shards
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mutate == '') }}
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: matrix
        name: Read shard matrix
        run: |
          set -euo pipefail
          {
            echo 'include<<EOF'
            node scripts/mutation-shards.mjs --matrix
            echo EOF
          } >> "$GITHUB_OUTPUT"

  # スケジュール / 手動（mutate 未指定）はシャード並列
  mutation-sharded:
    name: Stryker (${{ matrix.id }})
    needs: mutation-shard-matrix
    if: ${{ needs.mutation-shard-matrix.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.mutation-shard-matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # シャード単位で incremental を分離（並列ジョブの競合を避ける）。
      # キーは id ではなく mutate ハッシュ付き cache。同じ id のまま範囲を変えても
      # 旧レポート（範囲外 sticky mutant）を restore しない。
      - name: Restore Stryker incremental cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental-${{ matrix.cache }}.json
          key: stryker-incremental-${{ matrix.cache }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-${{ matrix.cache }}-${{ runner.os }}-

      - name: Run mutation tests
        run: |
          set -euo pipefail
          args=(
            --incrementalFile "reports/stryker-incremental-${CACHE_KEY}.json"
            --mutate "${MUTATE}"
          )
          if [ "${FORCE}" = "true" ]; then
            args+=(--force)
          fi
          echo "Shard=${SHARD_ID}"
          echo "Cache=${CACHE_KEY}"
          echo "Mutate=${MUTATE}"
          npx stryker run "${args[@]}"
        env:
          FORCE: ${{ inputs.force }}
          MUTATE: ${{ matrix.mutate }}
          SHARD_ID: ${{ matrix.id }}
          CACHE_KEY: ${{ matrix.cache }}

      - name: Upload mutation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-${{ matrix.id }}
          path: |
            reports/mutation/
            reports/stryker-incremental-${{ matrix.cache }}.json
          if-no-files-found: warn
          retention-days: 30
